name: Manual
# Builds the Sphinx manual in docs/ and publishes it on GitHub Pages at
# https://alexandriachemistry.github.io/plotXVG/ for pushes to main.
# Pull requests only build it, with warnings treated as errors.
# Needs Settings > Pages > Source "GitHub Actions" in the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one deployment at a time, without cancelling one that runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install plotxvg and Sphinx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt .
      - name: Build the manual
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Keep the manual
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
