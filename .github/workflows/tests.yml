name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Plot without a display
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install plotxvg
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Smoke test
        run: |
          plotxvg -v
          python -c "import tkinter, plotxvg"
      - name: Run all examples
        working-directory: tests
        run: python test.py ci-output
      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tests/ci-output/
          retention-days: 14
